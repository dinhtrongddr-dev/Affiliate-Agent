[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "affiliate-agent"
version = "0.2.0"
description = "Local-first affiliate video workflow for Shopee Video and Facebook Page Reels"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "watchdog>=6.0",
    "rapidfuzz>=3.9",
    "pydantic-settings>=2.7",
    "playwright>=1.60",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
affiliate-agent = "agent_core.cli:main"
shopee-login = "agent_core.shopee_login:main"

[tool.setuptools]
package-dir = { "" = "services" }
packages = ["agent_core", "agent_core.editor", "agent_core.web"]

[tool.setuptools.package-data]
"agent_core.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "tests"]
extend-exclude = ["vendor", "cache", "profiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
